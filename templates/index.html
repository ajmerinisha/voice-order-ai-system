<!DOCTYPE html>
<html lang="en">

<head>

    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">

    <title>Voice Order AI</title>

    <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;500;600;700&display=swap" rel="stylesheet">

    <style>

        *{
            margin:0;
            padding:0;
            box-sizing:border-box;
        }

        body{

            font-family:'Poppins', sans-serif;

            background: linear-gradient(
                135deg,
                #141e30,
                #243b55
            );

            height:100vh;

            display:flex;
            justify-content:center;
            align-items:center;
        }

        .container{

            width:450px;

            background:white;

            padding:40px;

            border-radius:20px;

            text-align:center;

            box-shadow:0px 10px 30px rgba(0,0,0,0.3);

            animation:fadeIn 1s ease;
        }

        @keyframes fadeIn{

            from{
                opacity:0;
                transform:translateY(20px);
            }

            to{
                opacity:1;
                transform:translateY(0px);
            }
        }

        h1{

            color:#222;

            margin-bottom:25px;

            font-size:36px;

            font-weight:700;
        }

        p{

            color:#666;

            margin-bottom:30px;
        }

        #recordButton{

            background:linear-gradient(
                45deg,
                #ff416c,
                #ff4b2b
            );

            color:white;

            border:none;

            padding:18px 35px;

            font-size:20px;

            border-radius:50px;

            cursor:pointer;

            transition:0.3s;

            font-weight:600;

            box-shadow:0px 8px 20px rgba(255,75,43,0.4);
        }

        #recordButton:hover{

            transform:scale(1.05);

            box-shadow:0px 10px 25px rgba(255,75,43,0.6);
        }

        #recordButton:active{

            transform:scale(0.95);
        }

        .result-box{

            margin-top:35px;

            background:#f7f7f7;

            padding:25px;

            border-radius:15px;

            text-align:left;
        }

        .result-box h3{

            margin-bottom:15px;

            color:#333;
        }

        .result-item{

            margin:12px 0;

            font-size:18px;

            color:#444;
        }

        .label{

            font-weight:600;

            color:#111;
        }

        .mic{

            font-size:26px;
        }

    </style>

</head>

<body>

    <div class="container">

        <h1>🍔 Voice Order AI</h1>

        <p>
            Speak your food order using AI Voice Recognition
        </p>

        <button id="recordButton">

            <span class="mic">🎤</span>

            Start Recording

        </button>
        <br><br>

<button onclick="viewHistory()" id="recordButton">

    📜 View Order History

</button>

        <div class="result-box">

            <h3>AI Response</h3>

            <div class="result-item">
                <span class="label">Transcript:</span>
                <span id="transcript">Waiting...</span>
            </div>

            <div class="result-item">
                <span class="label">Intent:</span>
                <span id="intent">Waiting...</span>
            </div>

            <div class="result-item">
                <span class="label">Item:</span>
                <span id="item">Waiting...</span>
            </div>

            <div class="result-item">
                <span class="label">Quantity:</span>
                <span id="quantity">Waiting...</span>
            </div>

        </div>

    </div>

    <script src="{{ url_for('static', filename='js/recorder.js') }}"></script>

</body>
<script>

async function viewHistory(){

    const response = await fetch("/history");

    const data = await response.json();

    let text = "";

    data.history.forEach(order => {

        text += `
        <div class="result-item">
            🍔 ${order.quantity} ${order.item}
        </div>
        `;
    });

    document.querySelector(".result-box").innerHTML =
    `
    <h3>Previous Orders</h3>
    ${text}
    `;
}

</script>

</html>
