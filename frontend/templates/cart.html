
<!DOCTYPE html>
<html>

<head>

    <title>Cart</title>

    <link href="https://cdn.jsdelivr.net/npm/bootstrap@5.3.3/dist/css/bootstrap.min.css" rel="stylesheet">

    <style>

        body{
            background:#1f2633;
            color:white;
            font-family:Arial;
        }

        .container{
            margin-top:50px;
        }

        h1{
            font-size:55px;
            margin-bottom:30px;
        }

        table{
            border:1px solid #555;
        }

        th{
            font-size:22px;
            padding:15px !important;
        }

        td{
            font-size:20px;
            padding:15px !important;
        }

        tr:hover{
            background:#2d3748;
        }

        .btn{
            padding:10px 20px;
            font-size:18px;
            border-radius:10px;
            font-weight:bold;
            margin-right:10px;
        }

    </style>

</head>

<body>

<div class="container">

    <h1>
        🛒 Cart Items
    </h1>

    <table class="table table-dark table-bordered">

        <tr>

            <th>ID</th>
            <th>Item</th>
            <th>Quantity</th>

        </tr>

        {% for item in cart_items %}

        <tr>

            <td>{{ item[0] }}</td>
            <td>{{ item[1] }}</td>
            <td>{{ item[2] }}</td>

        </tr>

        {% endfor %}

    </table>

    <!-- BUTTONS -->

    <a href="/" class="btn btn-warning">
        ⬅ Back
    </a>

    <a href="/clear_cart" class="btn btn-danger">
        🗑 Clear Cart
    </a>

</div>

</body>

</html>
